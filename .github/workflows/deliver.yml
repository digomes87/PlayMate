name: deliver

# Every push to a work branch opens (or reuses) a pull request into develop,
# runs the tests and, when they pass, merges it into develop. The merge is
# pushed with the deploy key so that it triggers the promote workflow; the
# pull request is marked as merged by GitHub once its commits land on develop.

on:
  push:
    branches: ['feature/**', 'fix/**', 'chore/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deliver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open pull request into develop
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already open."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" \
            --title "${HEAD_MESSAGE%%$'\n'*}" \
            --body "Opened automatically on push to \`$BRANCH\`. It is merged into \`develop\` as soon as the tests pass."

  tests:
    uses: ./.github/workflows/tests.yml

  merge:
    needs: [pull-request, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: merge-into-develop
      cancel-in-progress: false
    steps:
      - name: Require the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.PROMOTE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::PROMOTE_DEPLOY_KEY is missing. Run scripts/setup/configure-github.sh."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_DEPLOY_KEY }}
      - name: Merge tested commit into develop
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff "$GITHUB_SHA" -m "Merge branch '$BRANCH' into develop"
          git push origin HEAD:refs/heads/develop
