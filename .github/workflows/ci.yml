name: ci

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pull requests opened by the deliver workflow are already tested there.
jobs:
  tests:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/tests.yml
